# DOOM port: 8 s system trace — scheduling (who runs / who waits), CPU and GPU frequency, GPU work periods.
buffers { size_kb: 131072 fill_policy: RING_BUFFER }
buffers { size_kb: 4096 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/gpu_frequency"
      ftrace_events: "power/gpu_work_period"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      buffer_size_kb: 16384
      drain_period_ms: 250
    }
  }
}
data_sources { config { name: "linux.process_stats" target_buffer: 1 process_stats_config { scan_all_processes_on_start: true } } }
data_sources { config { name: "android.gpu.memory" target_buffer: 1 } }
data_sources { config { name: "linux.sys_stats" target_buffer: 1 sys_stats_config { stat_period_ms: 250 stat_counters: STAT_CPU_TIMES } } }
duration_ms: 8000
